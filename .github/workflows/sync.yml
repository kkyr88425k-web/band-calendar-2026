name: Sync Calendar

on:
  schedule:
    - cron: '0 */.5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Calendar Parser
        run: python parse_calendar.py

      - name: Commit and Push calendar.ics
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add calendar.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update calendar.ics" && git push)
